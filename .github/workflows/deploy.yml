name: Deploy Sentinel

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build API image
      - name: Extract API metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/getpayd-tech/sentinel-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=long

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./sentinel-api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          cache-from: type=gha,scope=sentinel-api
          cache-to: type=gha,mode=max,scope=sentinel-api

      # Build UI image
      - name: Extract UI metadata
        id: meta-ui
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/getpayd-tech/sentinel-ui
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=long

      - name: Build and push UI
        uses: docker/build-push-action@v6
        with:
          context: ./sentinel-ui
          push: true
          tags: ${{ steps.meta-ui.outputs.tags }}
          cache-from: type=gha,scope=sentinel-ui
          cache-to: type=gha,mode=max,scope=sentinel-ui

      # Deploy to server
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u getpayd-tech --password-stdin
            cd /apps/sentinel
            sed -i -E 's#ghcr\.io/getpayd-tech/sentinel-api:[^[:space:]]+#ghcr.io/getpayd-tech/sentinel-api:latest#g' docker-compose.yml
            sed -i -E 's#ghcr\.io/getpayd-tech/sentinel-ui:[^[:space:]]+#ghcr.io/getpayd-tech/sentinel-ui:latest#g' docker-compose.yml
            docker compose pull
            docker compose up -d --remove-orphans

            echo "Waiting for API health check..."
            for i in $(seq 1 12); do
              API_CID=$(docker compose ps -q sentinel-api | head -n 1)
              if [ -n "$API_CID" ] && docker exec "$API_CID" curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "API is healthy!"
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "Health check failed after 60s"
                docker compose logs --tail 50 sentinel-api
                exit 1
              fi
              echo "Attempt $i/12 — waiting 5s..."
              sleep 5
            done

            docker image prune -f
            echo "Sentinel deployed successfully"

      # Do not call Sentinel's deploy-running webhook path here. The SSH step
      # above is authoritative; this signed webhook only records the verified
      # external deploy so `sentinel status` stays truthful.
      - name: Record Sentinel deploy
        env:
          IMAGE_TAG: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SENTINEL_WEBHOOK_SECRET: ${{ secrets.SENTINEL_WEBHOOK_SECRET }}
          TRIGGERED_BY: ${{ github.actor }}
        run: |
          python3 - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          from pathlib import Path

          payload = {
              "project": "sentinel",
              "image_tag": os.environ["IMAGE_TAG"],
              "triggered_by": os.environ["TRIGGERED_BY"],
              "record_only": True,
              "record_status": "success",
              "record_metadata": {
                  "source": "github_actions_ssh_deploy",
                  "run_url": os.environ["RUN_URL"],
                  "images": {
                      "sentinel-api": f"ghcr.io/getpayd-tech/sentinel-api:{os.environ['IMAGE_TAG']}",
                      "sentinel-ui": f"ghcr.io/getpayd-tech/sentinel-ui:{os.environ['IMAGE_TAG']}",
                  },
              },
          }
          body = json.dumps(payload, separators=(",", ":"), sort_keys=True)
          signature = hmac.new(
              os.environ["SENTINEL_WEBHOOK_SECRET"].encode("utf-8"),
              body.encode("utf-8"),
              hashlib.sha256,
          ).hexdigest()
          Path("sentinel_record_payload.json").write_text(body, encoding="utf-8")
          Path("sentinel_record_signature.txt").write_text(signature, encoding="utf-8")
          PY

          curl -sf -X POST https://sentinel.paydlabs.com/api/v1/deployments/webhook \
            -H "X-Hub-Signature-256: sha256=$(cat sentinel_record_signature.txt)" \
            -H "Content-Type: application/json" \
            --data-binary @sentinel_record_payload.json
