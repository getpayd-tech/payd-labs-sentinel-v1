name: Sentinel CLI tests

on:
  pull_request:
    paths:
      - "sentinel-cli/**"
      - ".github/workflows/cli-tests.yml"
  push:
    branches: [main]
    paths:
      - "sentinel-cli/**"
      - ".github/workflows/cli-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ./sentinel-cli
      - run: python -m unittest discover -s sentinel-cli/tests -p "test_*.py"
